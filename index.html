<script>
const $ = id => document.getElementById(id);
let KEY = '', HASH = '', URL0 = '', DATA = null, SORT = 'u', lastAt = '';
const enc = new TextEncoder();
const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hexBytes = h => new Uint8Array(h.match(/../g).map(x => parseInt(x, 16)));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// service_watch.ps1의 Seal과 같은 방식: 열쇠(hex) → SHA-256으로 암호화·위조확인 열쇠, 내용 = IV(16)+암호문+HMAC(32)
async function open_(b64) {
  const all = fromB64(b64), iv = all.slice(0, 16), mac = all.slice(-32), ct = all.slice(16, -32);
  const ek = await crypto.subtle.digest('SHA-256', enc.encode('g4svc-enc:' + KEY));
  const mk = await crypto.subtle.digest('SHA-256', enc.encode('g4svc-mac:' + KEY));
  const hk = await crypto.subtle.importKey('raw', mk, {name: 'HMAC', hash: 'SHA-256'}, false, ['verify']);
  const body = new Uint8Array([...enc.encode('svc'), ...iv, ...ct]);
  if (!await crypto.subtle.verify('HMAC', hk, mac, body)) throw new Error('열쇠가 맞지 않음');
  const ak = await crypto.subtle.importKey('raw', ek, {name: 'AES-CBC'}, false, ['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-CBC', iv}, ak, ct)));
}

// v7(2026-11-25): 구글이 직접 읽은 것(cloud)은 앱스크립트에 AES가 없어 HMAC-SHA256 카운터 방식 — 공용기록 스크립트 seal2_와 짝
async function open2_(b64) {
  const all = fromB64(b64), nonce = all.slice(0, 16), mac = all.slice(-32), ct = all.slice(16, -32);
  const ek = await crypto.subtle.digest('SHA-256', enc.encode('g4svc-enc:' + KEY));
  const mk = await crypto.subtle.digest('SHA-256', enc.encode('g4svc-mac:' + KEY));
  const hk = await crypto.subtle.importKey('raw', mk, {name: 'HMAC', hash: 'SHA-256'}, false, ['verify']);
  if (!await crypto.subtle.verify('HMAC', hk, mac, new Uint8Array([...enc.encode('svc2'), ...nonce, ...ct]))) throw new Error('열쇠가 맞지 않음');
  const sk = await crypto.subtle.importKey('raw', ek, {name: 'HMAC', hash: 'SHA-256'}, false, ['sign']);
  const pt = new Uint8Array(ct.length);
  for (let i = 0; i * 32 < ct.length; i++) {
    const blk = new Uint8Array(await crypto.subtle.sign('HMAC', sk, new Uint8Array([...nonce, (i >>> 24) & 255, (i >>> 16) & 255, (i >>> 8) & 255, i & 255])));
    for (let j = 0; j < 32 && i * 32 + j < ct.length; j++) pt[i * 32 + j] = ct[i * 32 + j] ^ blk[j];
  }
  return JSON.parse(new TextDecoder().decode(pt));
}

function ago(s) {

// 단지 입체 그림 (2026-11-25 사용자 '3D 느낌, 거의 측면으로', '그림 퀄리티는 높게')

  408: [86, 480, 52, 13], 402: [205, 513, 78, -40], 409: [106, 598, 52, 15.5], 401: [262, 609, 80, -42], 410: [188, 707, 52, 13]};   // 11-25 스카이뷰 확대로 다시 잼: 407·408·409동은 단지 곡선 따라 가파르게 비스듬 · 11-26 406동은 405동과 한 줄(같은 축)로 (사용자) · 11-26 409동은 큰길을 침범해 서쪽으로 12 옮김 · 408동은 서쪽 옹벽 밖으로 나가 있어 북동쪽으로 옮김 (옹벽·큰길 사이 가운데)
const FLOORS = {403: 13};

// 동마다 기울기가 조금씩 다름 (BLD 4번째 값, 오른쪽이 내려가면 +) · 칸 = [u1, u2, v1, v2] 카카오 지도 픽셀, u 앞줄 따라 동쪽 · v 남쪽 · 지도 좌표 = 0.495배
const TOWER = {407: 1, 408: 1, 409: 1, 410: 1};
const TOWER_UNITS = [[-52, -26, 0, 38], [-26, -1, 0, 50], [-1, 25, 0, 52], [25, 52, 0, 44], [-30, 8, -26, 0], [8, 52, -34, 0]];
function towerBoxes(cx, cz, ang) {   // → [중심x, 중심z, 가로(앞줄 방향), 깊이] 지도 좌표
  const k = 0.495, uc = 4.7, vc = 9.9, a = ang * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);

const pts = a => a.map(p => P(...p).join(',')).join(' ');

  if (SORT === 'u') rows.sort((x, y) => (+x.dong - +y.dong) || (parseInt(x.ho) - parseInt(y.ho)));
  else rows.sort((x, y) => x.d < y.d ? 1 : x.d > y.d ? -1 : 0);
  // 동·호순: 동마다 묶고 줄에는 호만 / 접수순: 한 묶음에 '동-호'
  let html = '', g = null;
  const per = {}; rows.forEach(r => { per[r.dong] = (per[r.dong] || 0) + 1; });
  for (const r of rows) {
    if (SORT === 'u' && r.dong !== g) { html += (g === null ? '' : '</div>') + '<div class="grp"><div class="gh">' + esc(r.dong) + '동<span class="gn">' + per[r.dong] + '건</span></div>'; g = r.dong; }
    if (SORT === 'd' && g === null) { html += '<div class="grp">'; g = ''; }
    const u = SORT === 'u' ? r.ho : r.dong + '-' + r.ho.replace(/호$/, '');
    // 11-26 '며칠 지남' 꼬리표는 사용자가 필요 없다고 해서 뺌 → 접수일은 아래 줄에 글자로만
    html += '<div class="r"><span class="u">' + esc(u) + '</span><span class="loc">' + esc(r.loc || '-') + '</span>'
      + '<span class="txt">' + tel(r.txt) + (r.st && r.st !== '접수' ? '<span class="stt">' + esc(r.st) + '</span>' : '')
      + '<span class="who">신청 ' + esc(r.name) + ' · 접수 ' + esc(r.by) + ' · ' + esc(r.d.slice(5, 10).replace('-', '/')) + '</span></span></div>';
  }
  if (g !== null) html += '</div>';
  list.innerHTML = html ? html
    : '<div class="msg">' + (q.length ? '찾는 세대가 없습니다' : '처리할 잔손이 없습니다 👍') + '</div>';
}

// 11-26 휴대폰 앱(GitHub Pages에 올린 이 파일)은 구글 화면을 안 열고 자료만 받아 옴 — 구글 계정이 여러 개인 폰에서 '파일을 열 수 없습니다' 나던 것
const API = 'https://script.google.com/macros/s/AKfycbySUZQS3ZkAQpwK806avtfEzLR4dB7IVy_CUcvcVJkgkd6TG8thso_0Zdu3kacwC8we_A/exec';
const APP = 'https://cook814444-bot.github.io/g4/';
const GAS = typeof google !== 'undefined' && !!google.script;
function load() {
  // 11-26 받은 자료(암호화된 그대로)를 폰에 남겨 둠 → 다음에 앱 켤 때 구글 기다리지 않고 바로 그림
  if (!GAS) { fetch(API + '?op=svcjson', {cache: 'no-store'}).then(x => x.json()).then(r => { try { localStorage.setItem('g4svc_last', JSON.stringify(r)); } catch (e) {} return got(r); }, () => { $('st').textContent = '인터넷 연결을 확인해 주세요 (다시 시도 중)'; }); return; }
  google.script.run.withSuccessHandler(got).withFailureHandler(() => { $('st').textContent = '인터넷 연결을 확인해 주세요 (다시 시도 중)'; }).svcData();
}
async function got(r) {
    if (!r) { $('st').textContent = '아직 관리소 PC가 올린 자료가 없습니다'; return; }
    URL0 = r.url || URL0;
    const sig = r.at + '|' + (r.cloud ? r.cloud.at : '');
    if (sig === lastAt && DATA) { render(); return; }
    // 관리소 PC가 읽은 것과 구글이 읽은 것 중: 제대로 읽은 것 → 그중 새 것
    try {
      const c = [];
      if (r.data) c.push(await open_(r.data));
      if (r.cloud) c.push(await open2_(r.cloud.data));
      c.sort((x, y) => (+!!y.ok - +!!x.ok) || (x.at < y.at ? 1 : x.at > y.at ? -1 : 0));
      if (DATA && DATA.at > c[0].at) return;   // 남겨 둔 옛 자료가 새 자료보다 늦게 풀려도 덮어쓰지 않게
      DATA = c[0]; lastAt = sig; render();
    }
    catch (e) { $('st').textContent = '주소가 잘못되었습니다 (관리소에서 받은 주소 그대로 열어 주세요)'; }
}

// 2026-11-25 관리소 PC는 웹 앱을 거치지 않고 이 파일을 바로 엶 → service_watch.ps1이 옆에 쓰는 잔손_자료.js(암호화 안 함)를 읽음
function loadLocal() {
  const s = document.createElement('script');
  s.src = '잔손_자료.js?t=' + Date.now();
  s.onload = () => {
    s.remove();
    const r = window.G4SVC;
    if (!r) { $('st').textContent = '아직 자료가 없습니다 (잔손 현황 프로그램이 켜져 있는지 확인)'; return; }
    URL0 = r.url || URL0; HASH = r.k ? 'k=' + r.k : HASH;
    if (r.at === lastAt && DATA) { render(); return; }
    DATA = r; lastAt = r.at; render();
  };
  s.onerror = () => { s.remove(); $('st').textContent = '자료 파일이 없습니다 (잔손 현황 프로그램이 켜져 있는지 확인)'; };
  document.head.appendChild(s);
}

$('q').oninput = render;
$('s1').onclick = () => { SORT = 'u'; $('s1').className = 'on'; $('s2').className = ''; render(); };
$('s2').onclick = () => { SORT = 'd'; $('s2').className = 'on'; $('s1').className = ''; render(); };
// PC에서 열었을 때: QR을 휴대폰 카메라로 찍으면 같은 주소(열쇠 포함)로 열림
$('qb').onclick = () => {
  const b = $('qr');
  if (!b.hidden) { b.hidden = true; return; }
  if (!URL0 || typeof qrcode === 'undefined') return;
  const qr = qrcode(0, 'L'); qr.addData(APP + '#' + HASH); qr.make();   // 11-26 구글 웹 앱 주소 대신 휴대폰 앱 주소
  b.innerHTML = '<p>휴대폰 카메라로 찍어서 열고, 크롬 메뉴(⋮)에서 <b>앱 설치</b>(또는 홈 화면에 추가)를 누르면 홈 화면에 🔧 아이콘이 생깁니다.</p>' + qr.createImgTag(6, 0);
  b.querySelector('img').alt = 'QR'; b.hidden = false;
};

const start = h => {
  HASH = h || '';
  const m = HASH.match(/k=([0-9a-f]{64})/);
  if (m) { KEY = m[1]; try { localStorage.setItem('g4svc_k', KEY); } catch (e) {} }
  else { try { KEY = localStorage.getItem('g4svc_k') || ''; HASH = KEY ? 'k=' + KEY : ''; } catch (e) {} }
  if (!KEY) { $('st').textContent = '관리소에서 받은 주소(끝에 #k=… 가 붙은 주소)로 열어 주세요'; return; }
  if (!GAS) { try { const c = localStorage.getItem('g4svc_last'); if (c) got(JSON.parse(c)); } catch (e) {} }
  load();
  setInterval(load, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
};
if (GAS) google.script.url.getLocation(loc => start(loc.hash));
else if (location.protocol === 'https:') {   // 휴대폰 앱: 처음 QR로 열 때 #k=열쇠를 폰에 기억 → 홈 화면 아이콘으로 열면 주소에 열쇠가 없어도 됨
  start(location.hash.slice(1));
  if (location.hash) history.replaceState(null, '', location.pathname);
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
    // 11-26 sw.js가 뒤에서 받은 화면이 지금 것과 다르면 알려 줌 → 한 번만 새로고침 (전엔 고친 게 다음에 켤 때야 보였음)
    navigator.serviceWorker.addEventListener('message', ev => {
      if (ev.data !== 'g4-new') return;
      try { if (sessionStorage.getItem('g4_rl')) return; sessionStorage.setItem('g4_rl', '1'); } catch (e) {}
      location.reload();
    });
  }
} else {
  $('goback').hidden = false;
  loadLocal();
  setInterval(loadLocal, 20000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) loadLocal(); });
}
setInterval(render, 30000);  // '몇 분 전' 글자만 새로
</script>
</body></html>
